<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
#panel {
  background:#cce5ff;
  padding:20px;
  margin:10px 0;
  display:none; 
}
</style>
</head>
<body>
<button id="bDown">Slide Down</button>
<button id="bUp">Slide Up</button>
<button id="bToggle">Slide Toggle</button>
<div id="panel">Hello sir ian1</div>
<script>
$(document).ready(function(){
  $("#bDown").click(function(){
    $("#panel").slideDown(400);
  });
  $("#bUp").click(function(){
    $("#panel").slideUp(400);
  });
  $("#bToggle").click(function(){
    $("#panel").slideToggle(400);
  });
});
</script>
</body>
</html>
